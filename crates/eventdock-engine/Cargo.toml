[package]
name = "eventdock-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
eventdock = { version = "0.1.0", path = "../eventdock" }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
flume = { version = "0.11", features = ["async"] }
ctrlc = "3.4"
