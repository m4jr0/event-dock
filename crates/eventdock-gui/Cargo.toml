[package]
name = "eventdock-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
eventdock = { path = "../eventdock" }
eventdock-engine = { path = "../eventdock-engine" }
eframe = { version = "0.37.0", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rust-i18n = "4.2.4"
